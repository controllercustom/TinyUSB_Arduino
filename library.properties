sentence=TinyUSB device+host stack for Arduino GIGA R1 WiFi, running device and host simultaneously on its two USB controllers.
paragraph=Supported on the GIGA R1, where device (USB Type C) and host (USB Type A) run at the same time on independent controllers. Other boards — Raspberry Pi Pico (RP2040/RP2350), ESP32-S2/S3, Arduino Due, and the SAMD family including Zero, Nano 33 IoT, M0 Pro and Grand Central M4 — build and are compile-checked but are explicitly unsupported. Includes CDC, HID, MIDI, MSC, Audio, Printer, USBTMC, Network and more, on device and host sides.
